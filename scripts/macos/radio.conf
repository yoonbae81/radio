# macOS recorder configuration for a private Tailscale-only podcast setup.

# Apple Silicon Homebrew default paths.
FFMPEG_BIN="/opt/homebrew/bin/ffmpeg"
FFPROBE_BIN="/opt/homebrew/bin/ffprobe"

# Helper binaries.
PYTHON_BIN="/usr/bin/python3"
TAILSCALE_BIN="tailscale"

# Recordings and generated feed.xml files are stored here.
OUTPUT_DIR="$HOME/Music/radio-archive"

# Local HTTP port that Tailscale Serve proxies to.
PODCAST_HTTP_PORT="17880"

# Allow launchd's 60-second polling to start a recording up to 5 minutes late.
MATCH_WINDOW_MINUTES="5"

# Re-encode to AAC for broad podcast compatibility.
AUDIO_CODEC="aac"
AUDIO_BITRATE="128k"

# Enable feed.xml generation after each recording.
FEED_ENABLED="1"

# Leave empty to auto-derive the Tailscale HTTPS base URL from MagicDNS.
PUBLIC_BASE_URL=""

PODCAST_AUTHOR="EBS Radio Archive"
PODCAST_LANGUAGE="ko-KR"
PODCAST_DESCRIPTION="Private EBS radio archive for personal listening"
PODCAST_COPYRIGHT="Personal use only"
PODCAST_EXPLICIT="no"
PODCAST_IMAGE_URL=""

# User-verified working EBS live stream.
EBS_FM_STREAM="https://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8"

# Format:
# PROGRAMn="alias|title|days|HH:MM|duration_minutes|stream_url"
PROGRAM1="ebs-beginner-radio|EBS 초급 라디오|MON-WED|05:00|20|$EBS_FM_STREAM"
PROGRAM2="ebs-intermediate-radio|EBS 중급 라디오|THU-SAT|05:00|20|$EBS_FM_STREAM"
